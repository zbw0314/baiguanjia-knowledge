{% if page.scope == "省级服务" or page.scope == "城市服务" or page.scope == "区县服务" or page.scope == "直辖市区县服务" %}
{% assign location_url_parts = page.url | split: "/" %}
{% assign province_path_name = location_url_parts[2] %}
{% assign city_path_name = location_url_parts[3] %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "@id": "{{ page.url | absolute_url }}#service",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "serviceType": "殡葬服务",
  "provider": {
    "@type": "Organization",
    "@id": "https://zbw0314.github.io/baiguanjia.github.io/#organization",
    "name": "白管家",
    "url": "https://zbw0314.github.io/baiguanjia.github.io/",
    "telephone": "+86-177-1523-3570"
  },
  "areaServed": {
    "@type": "{% if page.district %}AdministrativeArea{% elsif page.city %}City{% else %}AdministrativeArea{% endif %}",
    "name": {% if page.district %}{{ page.district | jsonify }}{% elsif page.city %}{{ page.city | jsonify }}{% else %}{{ page.province | jsonify }}{% endif %},
    "containedInPlace": {
      "@type": "{% if page.district %}City{% elsif page.city %}AdministrativeArea{% else %}Country{% endif %}",
      "name": {% if page.district %}{{ page.city | jsonify }}{% elsif page.city %}{{ page.province | jsonify }}{% else %}"中国"{% endif %}
    }
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "@id": "{{ page.url | absolute_url }}#breadcrumb",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "白管家全国殡葬服务知识库",
      "item": "{{ "/" | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "全国殡葬服务地区与覆盖范围",
      "item": "{{ "/覆盖城市.html" | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.province | jsonify }},
      "item": "{% if page.scope == "省级服务" %}{{ page.url | absolute_url }}{% else %}{{ "/城市/" | append: province_path_name | append: ".html" | absolute_url }}{% endif %}"
    }{% if page.scope == "城市服务" %},
    {
      "@type": "ListItem",
      "position": 4,
      "name": {{ page.city | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }{% elsif page.scope == "直辖市区县服务" %},
    {
      "@type": "ListItem",
      "position": 4,
      "name": {{ page.district | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }{% elsif page.scope == "区县服务" %},
    {
      "@type": "ListItem",
      "position": 4,
      "name": {{ page.city | jsonify }},
      "item": "{{ "/城市/" | append: province_path_name | append: "/" | append: city_path_name | append: ".html" | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 5,
      "name": {{ page.district | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }{% endif %}
  ]
}
</script>
{% endif %}
